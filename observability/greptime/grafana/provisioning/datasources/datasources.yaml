apiVersion: 1

# uid: prometheus is deliberate. The SLM dashboards reference their datasources by uid, and 28 of
# their 34 references are prometheus-typed, so serving GreptimeDB's PromQL endpoint under that uid
# carries them over unedited.
datasources:
   - name: Prometheus
     uid: prometheus
     type: prometheus
     access: proxy
     url: http://greptimedb:4000/v1/prometheus
     isDefault: true
     jsonData:
        httpMethod: POST
        httpHeaderName1: x-greptime-db-name
        # Must match the app's 60s PeriodicExportingMetricReader interval, as in ../../grafana. It sets
        # $__rate_interval, and anything shorter puts fewer than two samples in the window, so every
        # rate() panel renders No data.
        timeInterval: 60s
     secureJsonData:
        httpHeaderValue1: public

   - name: Traces
     uid: tempo
     type: jaeger
     access: proxy
     url: http://greptimedb:4000/v1/jaeger
     jsonData:
        httpHeaderName1: x-greptime-db-name
     secureJsonData:
        httpHeaderValue1: public

   - name: GreptimeDB SQL
     uid: greptime-sql
     type: mysql
     access: proxy
     url: greptimedb:4002
     database: public
     jsonData:
        timezone: UTC

   # GreptimeDB serves neither LogQL nor profiles, but the dashboards still reference these two uids.
   # Grafana fails the whole dashboard build on an unresolvable datasource, blanking every panel
   # including the working ones, so these exist purely to resolve. Their panels error individually,
   # which is the intended outcome: visibly broken beats silently absent.
   - name: Loki (unavailable)
     uid: loki
     type: loki
     access: proxy
     url: http://greptime-has-no-logql.invalid

   - name: Pyroscope (unavailable)
     uid: pyroscope
     type: grafana-pyroscope-datasource
     access: proxy
     url: http://greptime-has-no-profiling.invalid
