# Three views onto the one GreptimeDB instance: PromQL for metrics, the Jaeger API for traces, and
# MySQL-protocol SQL for logs.
#
# The uids are load-bearing. Dashboards reference datasources by uid, so `prometheus` and `tempo` are
# kept as the names the panels already use rather than renamed to match the engine behind them.
apiVersion: 1

datasources:
   - name: Prometheus
     type: prometheus
     uid: prometheus
     url: http://greptimedb:4000/v1/prometheus
     isDefault: true
     editable: true
     jsonData:
        httpMethod: POST
        httpHeaderName1: x-greptime-db-name
        # Must match the app's PeriodicExportingMetricReader interval. It sets $__rate_interval, and
        # anything shorter puts fewer than two samples in the window, so every rate() panel renders No
        # data while the gauges keep working.
        timeInterval: 60s
     secureJsonData:
        httpHeaderValue1: public

   - name: Traces
     type: jaeger
     uid: tempo
     url: http://greptimedb:4000/v1/jaeger
     editable: true
     jsonData:
        httpHeaderName1: x-greptime-db-name
        # span -> the op RED metrics for the same op name
        tracesToMetrics:
           datasourceUid: 'prometheus'
           queries:
              - name: 'Op duration p95'
                query: 'histogram_quantile(0.95, sum by (le) (rate(slm_op_duration_seconds_bucket{slm_op_name="$${__span.name}"}[5m])))'
        nodeGraph:
           enabled: true
     secureJsonData:
        httpHeaderValue1: public

   - name: GreptimeDB SQL
     type: mysql
     uid: greptime-sql
     url: greptimedb:4002
     database: public
     editable: true
     jsonData:
        timezone: UTC
