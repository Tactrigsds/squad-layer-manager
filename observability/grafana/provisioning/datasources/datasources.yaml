# One store per signal, each reached through the API its tooling already speaks: VictoriaMetrics serves
# the Prometheus API and VictoriaTraces the Jaeger one, so those two are Grafana's own datasources with
# no plugin. Logs use the VictoriaLogs plugin (installed via GF_INSTALL_PLUGINS in docker-compose.yaml).
#
# The uids are load-bearing. Dashboards reference datasources by uid, so `prometheus` and `tempo` are
# kept as the names the panels already use rather than renamed to match what is behind them.
apiVersion: 1

datasources:
   - name: Prometheus
     type: prometheus
     uid: prometheus
     url: http://victoria-metrics:8428
     isDefault: true
     editable: true
     jsonData:
        httpMethod: POST
        # Must match the app's PeriodicExportingMetricReader interval. It sets $__rate_interval, and
        # anything shorter puts fewer than two samples in the window, so every rate() panel renders No
        # data while the gauges keep working.
        timeInterval: 60s
        exemplarTraceIdDestinations:
           - name: trace_id
             datasourceUid: tempo
             urlDisplayLabel: 'Trace: $${__value.raw}'

   - name: Traces
     type: jaeger
     uid: tempo
     url: http://victoria-traces:10428/select/jaeger
     editable: true
     jsonData:
        # span -> the log lines emitted inside it
        tracesToLogsV2:
           customQuery: true
           datasourceUid: 'victorialogs'
           query: 'trace_id:"$${__trace.traceId}"'
        # span -> the op RED metrics for the same op name
        tracesToMetrics:
           datasourceUid: 'prometheus'
           queries:
              - name: 'Op duration p95'
                query: 'histogram_quantile(0.95, sum by (le) (rate(slm_op_duration_seconds_bucket{slm_op_name="$${__span.name}"}[5m])))'
        nodeGraph:
           enabled: true

   - name: VictoriaLogs
     type: victoriametrics-logs-datasource
     uid: victorialogs
     url: http://victoria-logs:9428
     editable: true
     jsonData:
        # how many lines a panel or an Explore query returns before it stops
        maxLines: 1000
        # Generates the trace_id derived field (log line -> the trace it was emitted inside) and the log
        # level rules that colour Explore by severity. The detection block is not optional here:
        # auto-detection only runs in the settings UI, so a provisioned datasource that sets `enabled`
        # alone gets neither.
        otelPreset:
           enabled: true
           tracesDatasourceUid: tempo
           detection:
              traceIdField: trace_id
              severity:
                 # VictoriaLogs maps OTLP severityText onto `severity`, uppercase
                 field: severity
                 valueCase: string
                 source: manual
