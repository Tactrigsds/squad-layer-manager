name: SLM Docker CI
# Allow writing to GitHub Packages
permissions:
   contents: read
   packages: write

on:
   push:
      branches: ['main']

jobs:
   build:
      runs-on: ubuntu-latest
      outputs:
         image-tag: ${{ steps.tags.outputs.IMAGE_TAG }}
         test-image: ${{ steps.tags.outputs.IMAGE_REPO }}@${{ steps.test-image.outputs.digest }}
      steps:
         - uses: actions/checkout@v4

         # Images are identified by commit sha only. `:latest` is added after the gates pass (see tag-latest),
         # and everything downstream consumes the test image by digest.
         - name: Generate image tags
           id: tags
           run: |
              OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              COMMIT_SHA="${{ github.sha }}"
              SHORT_SHA="${COMMIT_SHA:0:7}"
              REPO="ghcr.io/$OWNER/squad-layer-manager"

              echo "IMAGE_REPO=$REPO" >> $GITHUB_OUTPUT
              echo "IMAGE_TAG=$REPO:commit-$SHORT_SHA" >> $GITHUB_OUTPUT

              # The test image is handed to the integration suite by digest, so this tag only exists to keep the
              # version reachable in GHCR; one moving tag rather than one per commit.
              echo "TEST_IMAGE_TAG=$REPO:test-main" >> $GITHUB_OUTPUT

         - name: Set up Docker Buildx
           uses: docker/setup-buildx-action@v3

         - name: Login to GitHub Container Registry
           uses: docker/login-action@v3
           with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

         # `target:` must stay explicit. Without it the action builds the Dockerfile's LAST stage, so appending a
         # stage silently changes what gets published -- which is how the test stage once shipped as the release.
         - name: Build and tag Docker image
           uses: docker/build-push-action@v6
           with:
              context: .
              target: runtime
              push: true
              cache-from: type=gha
              build-args: |
                 GIT_SHA=${{ github.sha }}
                 GIT_BRANCH=${{ github.ref_name }}
              tags: ${{ steps.tags.outputs.IMAGE_TAG }}

         # The test stage is `FROM runtime`, so building it here costs only the layers the tests add: the runtime
         # graph is already in this builder. The integration suite then pulls it by digest instead of rebuilding
         # the whole thing (rust wasm, pnpm install, vite build) in a parallel job with a cold cache.
         # cache-to only on this build: exporting the test graph exports the runtime and builder stages with it.
         - name: Build and push test image
           id: test-image
           uses: docker/build-push-action@v6
           with:
              context: .
              target: test
              push: true
              cache-from: type=gha
              cache-to: type=gha,mode=max
              build-args: |
                 GIT_SHA=${{ github.sha }}
                 GIT_BRANCH=${{ github.ref_name }}
              tags: ${{ steps.tags.outputs.TEST_IMAGE_TAG }}

   quality-checks:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: '24'

         - name: Install pnpm
           uses: pnpm/action-setup@v4
           with:
              version: 10.22.0

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Run type checking
           run: pnpm run check

         - name: Run format checking
           run: pnpm run format:check

         - name: Run linting
           run: pnpm run lint

         - name: Run tests
           run: pnpm run test

   # Decides whether the integration suite already ran green on this exact content: if the merged commit's tree
   # is identical to the PR head's tree (a squash of an up-to-date branch, or a merge where main hadn't moved),
   # the PR's green run covers it. Every failure mode falls through to skip=false, so the suite runs.
   #
   # Known limit: the pull_request run executes the PR's own workflow file, so a PR that neuters the suite can
   # present a green check. The workflow diff is visible in review; this gate trusts review.
   skip-gate:
      runs-on: ubuntu-latest
      outputs:
         skip: ${{ steps.gate.outputs.SKIP }}
      steps:
         - name: Check for a green PR run on an identical tree
           id: gate
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              # no set -e: this job must never fail, only decline to skip
              REPO="${{ github.repository }}"
              SKIP=false

              MERGE=$(gh api "repos/$REPO/git/commits/${{ github.sha }}" 2>/dev/null)
              MERGE_TREE=$(jq -r '.tree.sha // empty' <<<"$MERGE")
              # merge commit: the second parent is the PR head. Squash commit: look up the associated PR.
              HEAD_SHA=$(jq -r '.parents[1].sha // empty' <<<"$MERGE")
              if [[ -z "$HEAD_SHA" ]]; then
                HEAD_SHA=$(gh api "repos/$REPO/commits/${{ github.sha }}/pulls" --jq '.[0].head.sha // empty' 2>/dev/null)
              fi

              if [[ -n "$HEAD_SHA" && -n "$MERGE_TREE" ]]; then
                HEAD_TREE=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq '.tree.sha // empty' 2>/dev/null)
                if [[ "$HEAD_TREE" == "$MERGE_TREE" ]]; then
                  CONCLUSION=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=integration-tests" \
                    --jq '.check_runs[0].conclusion // empty' 2>/dev/null)
                  if [[ "$CONCLUSION" == "success" ]]; then
                    SKIP=true
                    echo "::notice::integration suite already green on $HEAD_SHA with an identical tree; skipping"
                  fi
                fi
              fi

              echo "SKIP=$SKIP" >> $GITHUB_OUTPUT

   # the integration/e2e suites, called as a job so that tagging and deploying can gate on them. Runs the test
   # image the build job already produced rather than building its own.
   integration-tests:
      needs: [build, skip-gate]
      # a failed skip-gate has empty outputs, so the suite runs
      if: ${{ !cancelled() && needs.build.result == 'success' && needs.skip-gate.outputs.skip != 'true' }}
      uses: ./.github/workflows/integration-tests.yml
      permissions:
         contents: read
         packages: read
      with:
         test-image: ${{ needs.build.outputs.test-image }}

   tag-latest:
      runs-on: ubuntu-latest
      needs: [build, quality-checks, integration-tests]
      # integration-tests may be skipped by the gate; that counts as passed, a failure or a cancel does not
      if: ${{ !cancelled() && github.ref == 'refs/heads/main'
         && needs.build.result == 'success'
         && needs.quality-checks.result == 'success'
         && contains(fromJSON('["success", "skipped"]'), needs.integration-tests.result) }}
      outputs:
         is-current: ${{ steps.tip.outputs.IS_CURRENT }}
      steps:
         # runs gated on the integration suite can finish out of order, so an older
         # commit's run must not clobber :latest (or deploy) behind a newer one
         - name: Check this commit is still the tip of main
           id: tip
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              TIP_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
              if [[ "$TIP_SHA" == "${{ github.sha }}" ]]; then
                echo "IS_CURRENT=true" >> $GITHUB_OUTPUT
              else
                echo "IS_CURRENT=false" >> $GITHUB_OUTPUT
                echo "::notice::main has moved to $TIP_SHA; skipping latest tag and deploy for ${{ github.sha }}"
              fi

         - name: Login to GitHub Container Registry
           if: steps.tip.outputs.IS_CURRENT == 'true'
           uses: docker/login-action@v3
           with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

         - name: Tag image as latest
           if: steps.tip.outputs.IS_CURRENT == 'true'
           run: |
              OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              COMMIT_TAG="${{ needs.build.outputs.image-tag }}"
              LATEST_TAG="ghcr.io/$OWNER/squad-layer-manager:latest"

              # Tag the commit-tagged image as latest without pulling/pushing
              docker buildx imagetools create --tag $LATEST_TAG $COMMIT_TAG

   deploy:
      runs-on: ubuntu-latest
      needs: [build, quality-checks, integration-tests, tag-latest]
      # tag-latest succeeding implies the other gates passed or were legitimately skipped
      if: ${{ !cancelled() && needs.tag-latest.result == 'success' && needs.tag-latest.outputs.is-current == 'true' }}
      steps:
         - uses: actions/checkout@v4

         # Only the secrets the script reads, by name. Exporting toJSON(secrets) and piping a variable into
         # bash is the exfiltration pattern GitHub's workflow scanner holds runs for approval over.
         - name: Deploy over Tailscale
           env:
              TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
              TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
              TAILSCALE_TAGS: ${{ secrets.TAILSCALE_TAGS }}
              DEPLOY_TAILSCALE_HOST: ${{ secrets.DEPLOY_TAILSCALE_HOST }}
              DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
              DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
           run: ./.github/scripts/deploy.sh
