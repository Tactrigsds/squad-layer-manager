name: SLM Docker CI
# Allow writing to GitHub Packages
permissions:
   contents: read
   packages: write

on:
   push:
      branches: ['main']

jobs:
   build:
      runs-on: ubuntu-latest
      outputs:
         image-tag: ${{ steps.tags.outputs.IMAGE_TAG }}
         test-image: ${{ steps.tags.outputs.IMAGE_REPO }}@${{ steps.test-image.outputs.digest }}
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

         # Images are identified by commit sha only. `:latest` is added after the gates pass (see publish),
         # and everything downstream consumes the test image by digest.
         - name: Generate image tags
           id: tags
           run: |
              OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              COMMIT_SHA="${{ github.sha }}"
              SHORT_SHA="${COMMIT_SHA:0:7}"
              REPO="ghcr.io/$OWNER/squad-layer-manager"

              echo "IMAGE_REPO=$REPO" >> $GITHUB_OUTPUT
              echo "IMAGE_TAG=$REPO:commit-$SHORT_SHA" >> $GITHUB_OUTPUT

              # The test image is handed to the integration suite by digest, so this tag only exists to keep the
              # version reachable in GHCR; one moving tag rather than one per commit.
              echo "TEST_IMAGE_TAG=$REPO:test-main" >> $GITHUB_OUTPUT

         - name: Set up Docker Buildx
           uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

         - name: Login to GitHub Container Registry
           uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
           with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

         # `target:` must stay explicit. Without it the action builds the Dockerfile's LAST stage, so appending a
         # stage silently changes what gets published -- which is how the test stage once shipped as the release.
         - name: Build and tag Docker image
           uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
           with:
              context: .
              target: runtime
              push: true
              cache-from: type=gha
              build-args: |
                 GIT_SHA=${{ github.sha }}
                 GIT_BRANCH=${{ github.ref_name }}
              tags: ${{ steps.tags.outputs.IMAGE_TAG }}

         # The test stage is `FROM runtime`, so building it here costs only the layers the tests add: the runtime
         # graph is already in this builder. The integration suite then pulls it by digest instead of rebuilding
         # the whole thing (rust wasm, pnpm install, vite build) in a parallel job with a cold cache.
         # cache-to only on this build: exporting the test graph exports the runtime and builder stages with it.
         - name: Build and push test image
           id: test-image
           uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
           with:
              context: .
              target: test
              push: true
              cache-from: type=gha
              cache-to: type=gha,mode=max
              build-args: |
                 GIT_SHA=${{ github.sha }}
                 GIT_BRANCH=${{ github.ref_name }}
              tags: ${{ steps.tags.outputs.TEST_IMAGE_TAG }}

   quality-checks:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

         - name: Setup Node.js
           uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
           with:
              node-version: '24'

         - name: Install pnpm
           uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
           with:
              version: 10.22.0

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Run type checking
           run: pnpm run check

         - name: Run format checking
           run: pnpm run format:check

         - name: Run linting
           run: pnpm run lint

         - name: Check the message catalogue is up to date
           run: pnpm run i18n:lint

         - name: Build the docs site
           run: pnpm run docs:build

         - name: Run tests
           run: pnpm run test

   # Decides whether the integration suite already ran green on this exact content: if the merged commit's tree
   # is identical to the PR head's tree (a squash of an up-to-date branch, or a merge where main hadn't moved),
   # the PR's green run covers it. Every failure mode falls through to skip=false, so the suite runs.
   #
   # Known limit: the pull_request run executes the PR's own workflow file, so a PR that neuters the suite can
   # present a green check. The workflow diff is visible in review; this gate trusts review.
   #
   # Also decides whether the merged PR carries the `fasttrack` label, which publishes and deploys without waiting
   # for the integration suite. The suite still runs, and a release still waits for it.
   skip-gate:
      runs-on: ubuntu-latest
      outputs:
         skip: ${{ steps.gate.outputs.SKIP }}
         fasttrack: ${{ steps.gate.outputs.FASTTRACK }}
      steps:
         - name: Check for a green PR run on an identical tree
           id: gate
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              # no set -e: this job must never fail, only decline to skip
              REPO="${{ github.repository }}"
              SKIP=false

              MERGE=$(gh api "repos/$REPO/git/commits/${{ github.sha }}" 2>/dev/null)
              MERGE_TREE=$(jq -r '.tree.sha // empty' <<<"$MERGE")
              # merge commit: the second parent is the PR head. Squash commit: look up the associated PR.
              HEAD_SHA=$(jq -r '.parents[1].sha // empty' <<<"$MERGE")
              if [[ -z "$HEAD_SHA" ]]; then
                HEAD_SHA=$(gh api "repos/$REPO/commits/${{ github.sha }}/pulls" --jq '.[0].head.sha // empty' 2>/dev/null)
              fi

              if [[ -n "$HEAD_SHA" && -n "$MERGE_TREE" ]]; then
                HEAD_TREE=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq '.tree.sha // empty' 2>/dev/null)
                if [[ "$HEAD_TREE" == "$MERGE_TREE" ]]; then
                  CONCLUSION=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=integration-tests" \
                    --jq '.check_runs[0].conclusion // empty' 2>/dev/null)
                  if [[ "$CONCLUSION" == "success" ]]; then
                    SKIP=true
                    echo "::notice::integration suite already green on $HEAD_SHA with an identical tree; skipping"
                  fi
                fi
              fi

              FASTTRACK=$(gh api "repos/$REPO/commits/${{ github.sha }}/pulls" \
                --jq 'map(select(.merge_commit_sha == "${{ github.sha }}"))[0].labels // [] | any(.name == "fasttrack")' \
                2>/dev/null)
              if [[ "$FASTTRACK" == "true" ]]; then
                echo "::notice::fasttrack label set; publishing without waiting for the integration suite"
              else
                FASTTRACK=false
              fi

              echo "SKIP=$SKIP" >> $GITHUB_OUTPUT
              echo "FASTTRACK=$FASTTRACK" >> $GITHUB_OUTPUT

   # the integration/e2e suites, called as a job so that tagging and deploying can gate on them. Runs the test
   # image the build job already produced rather than building its own.
   integration-tests:
      needs: [build, skip-gate]
      # a failed skip-gate has empty outputs, so the suite runs
      if: ${{ !cancelled() && needs.build.result == 'success' && needs.skip-gate.outputs.skip != 'true' }}
      uses: ./.github/workflows/integration-tests.yml
      permissions:
         contents: read
         packages: read
      with:
         test-image: ${{ needs.build.outputs.test-image }}

   publish:
      needs: [build, quality-checks, skip-gate, integration-tests]
      # integration-tests may be skipped by the gate; that counts as passed, a failure or a cancel does not
      if: ${{ !cancelled() && needs.skip-gate.outputs.fasttrack != 'true'
         && needs.build.result == 'success'
         && needs.quality-checks.result == 'success'
         && contains(fromJSON('["success", "skipped"]'), needs.integration-tests.result) }}
      uses: ./.github/workflows/publish.yml
      permissions:
         contents: read
         packages: write
      secrets: inherit
      with:
         image-tag: ${{ needs.build.outputs.image-tag }}

   # publish without integration-tests in `needs`. `needs` can't be conditional, and any job that lists the suite
   # waits for it even when it would not gate on its result.
   publish-fasttrack:
      needs: [build, quality-checks, skip-gate]
      if: ${{ !cancelled() && needs.skip-gate.outputs.fasttrack == 'true'
         && needs.build.result == 'success'
         && needs.quality-checks.result == 'success' }}
      uses: ./.github/workflows/publish.yml
      permissions:
         contents: read
         packages: write
      secrets: inherit
      with:
         image-tag: ${{ needs.build.outputs.image-tag }}

   # A release is the merge of the commit `pnpm release` made, which puts a new version at the top of
   # changelog/releases.json. The first green build carrying that version tags its commit `v<version>` and its image
   # `:<version>` and `:stable`. Unlike tag-latest this does not wait on being the tip of main: the release is this
   # commit, whatever has landed since.
   tag-release:
      runs-on: ubuntu-latest
      needs: [build, quality-checks, integration-tests]
      if: ${{ !cancelled() && github.ref == 'refs/heads/main'
         && needs.build.result == 'success'
         && needs.quality-checks.result == 'success'
         && contains(fromJSON('["success", "skipped"]'), needs.integration-tests.result) }}
      permissions:
         contents: write
         packages: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

         - name: Find an untagged release
           id: release
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              VERSION=$(jq -r '.[0].version // empty' changelog/releases.json)
              if [[ -z "$VERSION" ]]; then
                echo "::notice::no releases yet"
                exit 0
              fi
              if gh api "repos/${{ github.repository }}/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
                echo "v$VERSION is already tagged"
                exit 0
              fi
              echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

         - name: Login to GitHub Container Registry
           if: steps.release.outputs.VERSION != ''
           uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
           with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

         - name: Tag the release
           if: steps.release.outputs.VERSION != ''
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              VERSION="${{ steps.release.outputs.VERSION }}"
              OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              REPO="ghcr.io/$OWNER/squad-layer-manager"
              docker buildx imagetools create --tag "$REPO:$VERSION" --tag "$REPO:stable" "${{ needs.build.outputs.image-tag }}"
              gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/v$VERSION" -f sha="${{ github.sha }}"
