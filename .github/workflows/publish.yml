name: SLM Publish

# Tags an image built by the Docker CI workflow as :latest and deploys it. Only called from there, in one of two
# places: after the integration suite, or before it for a fasttracked PR (see skip-gate there).

on:
   workflow_call:
      inputs:
         image-tag:
            description: 'the commit-tagged image to publish'
            required: true
            type: string

permissions:
   contents: read
   packages: write

jobs:
   tag-latest:
      runs-on: ubuntu-latest
      if: ${{ github.ref == 'refs/heads/main' }}
      outputs:
         is-current: ${{ steps.tip.outputs.IS_CURRENT }}
      steps:
         # runs gated on the integration suite can finish out of order, so an older
         # commit's run must not clobber :latest (or deploy) behind a newer one
         - name: Check this commit is still the tip of main
           id: tip
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              TIP_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
              if [[ "$TIP_SHA" == "${{ github.sha }}" ]]; then
                echo "IS_CURRENT=true" >> $GITHUB_OUTPUT
              else
                echo "IS_CURRENT=false" >> $GITHUB_OUTPUT
                echo "::notice::main has moved to $TIP_SHA; skipping latest tag and deploy for ${{ github.sha }}"
              fi

         - name: Login to GitHub Container Registry
           if: steps.tip.outputs.IS_CURRENT == 'true'
           uses: docker/login-action@v3
           with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

         - name: Tag image as latest
           if: steps.tip.outputs.IS_CURRENT == 'true'
           run: |
              OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              COMMIT_TAG="${{ inputs.image-tag }}"
              LATEST_TAG="ghcr.io/$OWNER/squad-layer-manager:latest"

              # Tag the commit-tagged image as latest without pulling/pushing
              docker buildx imagetools create --tag $LATEST_TAG $COMMIT_TAG

   deploy:
      runs-on: ubuntu-latest
      needs: [tag-latest]
      if: ${{ needs.tag-latest.outputs.is-current == 'true' }}
      steps:
         - name: Run deployment script from variable
           env:
              SECRETS_JSON: ${{ toJSON(secrets) }}
              GITHUB_REF: ${{ github.ref }}
              DEPLOY_SCRIPT: ${{ vars.DEPLOY_JOB_SCRIPT }}
           run: |
              set -e

              # Export all secrets as environment variables
              echo "$SECRETS_JSON" | jq -r 'to_entries[] | "export \(.key)=\"\(.value)\""' > /tmp/secrets.env
              source /tmp/secrets.env
              rm -f /tmp/secrets.env

              # Convert line endings and run the deployment script
              echo "$DEPLOY_SCRIPT" | tr -d '\r' | bash
