name: SLM Integration Tests

# Runs the integration and e2e suites inside the `test` stage of the production image: the same base,
# the same client build, and the same server bundle the deployment runs (the tests spawn it). What's
# added is a browser, the test sources, and dev dependencies. See the Dockerfile's test stage.

# On pushes to main this runs as a called job of the Docker CI workflow, so that tagging :latest and
# deploying can depend on it (`needs` can't cross workflow boundaries). There the caller has already built the
# test image alongside the runtime one and passes it in, so this job only pulls it. The caller skips the call
# entirely when this suite already ran green on a PR head with an identical tree (see skip-gate there). On a
# pull request, and by hand, it builds the image itself off the cache main's build exported; cold, that takes
# the best part of an hour.

# A fork's pull request runs the fork's code, so this workflow gets a read-only token and no secrets. Nothing
# added here may push to a registry or take a secret, and it must never move to `pull_request_target`.
on:
   workflow_call:
      inputs:
         test-image:
            description: 'an already-built test image, by digest, to run instead of building one here'
            required: false
            type: string
            default: ''
   pull_request:
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   # keyed on the run id off a pull request, so that main's runs, which gate the deploy, never queue behind each other
   group: integration-tests-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
   integration-tests:
      runs-on: ubuntu-latest
      # generous because a run that builds its own image pays for that build before a test starts
      timeout-minutes: 90
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

         - name: Pull the pre-built test image
           if: ${{ inputs.test-image }}
           env:
              TEST_IMAGE: ${{ inputs.test-image }}
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              # by digest, not by tag: the tag the caller pushed is per-branch and a concurrent run may already
              # have moved it
              echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              docker pull "$TEST_IMAGE"
              docker tag "$TEST_IMAGE" slm-test:ci

         - name: Set up Docker Buildx
           if: ${{ !inputs.test-image }}
           uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

         # The layer artifacts are checked in (assets/layers) and baked into the image, so there is nothing to
         # download, cache or mount here: the tests run against the same pair production does.
         # Reads the cache main's build exported but never writes one: a pull request's cache is scoped to its own
         # branch, so all it could do is evict main's entries out of the repo's shared quota.
         - name: Build test image
           if: ${{ !inputs.test-image }}
           uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
           with:
              context: .
              target: test
              load: true
              tags: slm-test:ci
              cache-from: type=gha

         - name: Run integration and e2e tests
           run: |
              docker run --rm \
                -e CI=true \
                -v "$PWD/test-results:/app/test-results" \
                slm-test:ci

         - name: Upload failure artifacts
           if: failure()
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: playwright-results
              path: test-results
              retention-days: 7
              if-no-files-found: ignore
