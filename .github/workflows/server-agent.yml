name: Server Agent Release

# Builds the rust server agent (server-agent/agent), attaches per-platform binaries to the GitHub release for
# the tag (the squadjs plugin downloads these by name) and publishes the Docker image to GHCR. Tag a release as
# `server-agent-v<version>` (matching the version in server-agent/agent/Cargo.toml) to publish it.

on:
   push:
      tags:
         - 'server-agent-v*'
   workflow_dispatch:
      inputs:
         tag:
            description: 'existing server-agent-v* tag to build and upload to'
            required: true

permissions:
   contents: write

jobs:
   build:
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: ubuntu-latest
                 target: x86_64-unknown-linux-musl
                 asset: slm-server-agent-x86_64-unknown-linux-musl
               - os: windows-latest
                 target: x86_64-pc-windows-msvc
                 asset: slm-server-agent-x86_64-pc-windows-msvc.exe
      runs-on: ${{ matrix.os }}
      defaults:
         run:
            working-directory: server-agent/agent
      steps:
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

         - name: Install musl tools
           if: matrix.os == 'ubuntu-latest'
           run: |
              sudo apt-get update && sudo apt-get install -y musl-tools
              # ring compiles a little C for musl; point cc-rs and the linker at musl-gcc
              echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"

         - name: Install rust target
           run: rustup target add ${{ matrix.target }}

         - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
           with:
              workspaces: server-agent/agent

         - name: Build
           run: cargo build --release --target ${{ matrix.target }}

         - name: Stage asset (unix)
           if: matrix.os != 'windows-latest'
           run: cp target/${{ matrix.target }}/release/slm-server-agent ../${{ matrix.asset }}

         - name: Stage asset (windows)
           if: matrix.os == 'windows-latest'
           run: cp target/${{ matrix.target }}/release/slm-server-agent.exe ../${{ matrix.asset }}

         - name: Upload to release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
              tag_name: ${{ github.event.inputs.tag || github.ref_name }}
              files: server-agent/${{ matrix.asset }}

   # Publishes the agent's Docker image to GHCR so end users can `docker run` it instead of building it.
   # Tags it with the release version (server-agent-v<version> -> <version>) and `latest`.
   docker:
      runs-on: ubuntu-latest
      permissions:
         contents: read
         packages: write
      steps:
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

         - name: Compute image tags
           id: meta
           env:
              TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
           run: |
              OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              VERSION="${TAG_NAME#server-agent-v}"
              IMAGE="ghcr.io/$OWNER/slm-server-agent"
              echo "TAGS=$IMAGE:$VERSION,$IMAGE:latest" >> "$GITHUB_OUTPUT"

         - name: Set up Docker Buildx
           uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

         - name: Login to GitHub Container Registry
           uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
           with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

         - name: Build and push
           uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
           with:
              context: server-agent/agent
              push: true
              cache-from: type=gha
              cache-to: type=gha,mode=max
              tags: ${{ steps.meta.outputs.TAGS }}
