name: Server Agent Release

# Builds the rust server agent (server-agent/agent), attaches per-platform binaries to the GitHub release for
# the tag (the squadjs plugin downloads these by name) and publishes the Docker image to GHCR. Tag a release as
# `server-agent-v<version>` (matching the version in server-agent/agent/Cargo.toml) to publish it.

on:
   push:
      tags:
         - 'server-agent-v*'
   workflow_dispatch:
      inputs:
         tag:
            description: 'existing server-agent-v* tag to build and upload to'
            required: true

permissions:
   contents: write

jobs:
   build:
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: ubuntu-latest
                 target: x86_64-unknown-linux-musl
                 asset: slm-server-agent-x86_64-unknown-linux-musl
               - os: windows-latest
                 target: x86_64-pc-windows-msvc
                 asset: slm-server-agent-x86_64-pc-windows-msvc.exe
      runs-on: ${{ matrix.os }}
      defaults:
         run:
            working-directory: server-agent/agent
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

         - name: Install musl tools
           if: matrix.os == 'ubuntu-latest'
           run: |
              sudo apt-get update && sudo apt-get install -y musl-tools
              # ring compiles a little C for musl; point cc-rs and the linker at musl-gcc
              echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"

         - name: Install rust target
           run: rustup target add ${{ matrix.target }}

         - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
           with:
              workspaces: server-agent/agent

         - name: Build
           run: cargo build --release --target ${{ matrix.target }}

         - name: Stage asset (unix)
           if: matrix.os != 'windows-latest'
           run: cp target/${{ matrix.target }}/release/slm-server-agent ../${{ matrix.asset }}

         - name: Stage asset (windows)
           if: matrix.os == 'windows-latest'
           run: cp target/${{ matrix.target }}/release/slm-server-agent.exe ../${{ matrix.asset }}

         - name: Upload to release
           uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
           with:
              tag_name: ${{ github.event.inputs.tag || github.ref_name }}
              files: server-agent/${{ matrix.asset }}

   # Publishes the agent's Docker image to GHCR so end users can `docker run` it instead of building it.
   # Tags it with the release version (server-agent-v<version> -> <version>) and `latest`.
   docker:
      runs-on: ubuntu-latest
      permissions:
         contents: read
         packages: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

         - name: Compute image tags
           id: meta
           env:
              TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
           run: |
              OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              VERSION="${TAG_NAME#server-agent-v}"
              IMAGE="ghcr.io/$OWNER/slm-server-agent"
              echo "TAGS=$IMAGE:$VERSION,$IMAGE:latest" >> "$GITHUB_OUTPUT"

         - name: Set up Docker Buildx
           uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

         - name: Login to GitHub Container Registry
           uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
           with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

         - name: Build and push
           uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
           with:
              context: server-agent/agent
              push: true
              cache-from: type=gha
              cache-to: type=gha,mode=max
              tags: ${{ steps.meta.outputs.TAGS }}
