name: Changelog

# Checks that a pull request records what it changes: a fragment in changes/, or "Changelog: none" in its
# description. See changes/README.md and src/scripts/check-changelog.ts.

permissions:
   contents: read

on:
   pull_request:
      types: [opened, synchronize, reopened, edited]

jobs:
   check:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              # the check reads the commits between the base and the PR head
              fetch-depth: 0

         - name: Setup Node.js
           uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
           with:
              node-version: '24'

         - name: Install pnpm
           uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
           with:
              version: 10.22.0

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Check the changelog
           env:
              PR_BODY: ${{ github.event.pull_request.body }}
              BASE_REF: ${{ github.base_ref }}
           run: pnpm run changelog:check --base "origin/$BASE_REF"
