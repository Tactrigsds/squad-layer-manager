name: Changelog

# Checks that a pull request records what it changes: a fragment in changes/, or "Changelog: none" in its
# description. See changes/README.md and src/scripts/check-changelog.ts.

permissions:
   contents: read

on:
   pull_request:
      types: [opened, synchronize, reopened, edited]

jobs:
   check:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
           with:
              # the check reads the commits between the base and the PR head
              fetch-depth: 0

         - name: Setup Node.js
           uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
           with:
              node-version: '24'

         - name: Install pnpm
           uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
           with:
              version: 10.22.0

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Check the changelog
           env:
              PR_BODY: ${{ github.event.pull_request.body }}
              BASE_REF: ${{ github.base_ref }}
           run: pnpm run changelog:check --base "origin/$BASE_REF"
