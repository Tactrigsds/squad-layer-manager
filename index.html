<!doctype html>
<html lang="en">
	<head id="site-head">
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!--
      Single source of truth for the site's fonts and head metadata. The server-rendered landing and 403 pages
      parse the <meta>, <html> attributes and font/preconnect <link> tags out of this file so they match the app
      without duplicating them (they inline their own scoped Tailwind; see src/systems/landing.server.ts). Keep
      font/metadata links here.
    -->
		<!-- rendered from the instance's topBarColor, not built into dist/; see src/systems/logo.server.ts -->
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- for browsers that ignore an SVG icon and would otherwise upscale the 48px .ico entry -->
		<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div class="min-h-screen" id="root"></div>
		<!--
      How a packaged plugin's client bundle reaches the app's own React, zustand and slm/* rather than
      shipping copies: every specifier below resolves to a generated shim module that re-exports from
      this page. Must precede the module script. See src/models/plugin-api-shim.ts.
    -->
		<script type="importmap">
			{
				"imports": {
					"slm/": "/plugin-api/slm/",
					"react": "/plugin-api/pkg/react",
					"react/jsx-runtime": "/plugin-api/pkg/react/jsx-runtime",
					"rxjs": "/plugin-api/pkg/rxjs",
					"drizzle-orm": "/plugin-api/pkg/drizzle-orm",
					"drizzle-orm/sqlite-core": "/plugin-api/pkg/drizzle-orm/sqlite-core",
					"zod": "/plugin-api/pkg/zod",
					"@orpc/client": "/plugin-api/pkg/@orpc/client",
					"@orpc/server": "/plugin-api/pkg/@orpc/server"
				}
			}
		</script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
