name: slm-greptime

services:
   greptimedb:
      image: greptime/greptimedb:v1.1.4
      command:
         - standalone
         - start
         - --http-addr=0.0.0.0:4000
         - --rpc-bind-addr=0.0.0.0:4001
         - --mysql-addr=0.0.0.0:4002
      ports:
         - 127.0.0.1:4400:4000
         - 127.0.0.1:4402:4002
      volumes:
         - greptime_data:/greptimedb_data
      healthcheck:
         test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
         interval: 5s
         timeout: 3s
         retries: 24
         start_period: 10s
      restart: unless-stopped

   otel-collector:
      image: otel/opentelemetry-collector-contrib:0.157.0
      command: ['--config=/etc/otelcol/config.yaml']
      volumes:
         - ./observability/greptime/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      ports:
         - 127.0.0.1:4417:4317
         - 127.0.0.1:4418:4318
      depends_on:
         greptimedb:
            condition: service_healthy
      restart: unless-stopped

   grafana:
      image: grafana/grafana:13.1.1
      environment:
         - GF_AUTH_ANONYMOUS_ENABLED=true
         - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
         - GF_SECURITY_ADMIN_PASSWORD=admin
      ports:
         - 127.0.0.1:3301:3000
      volumes:
         - ./observability/greptime/grafana/provisioning:/etc/grafana/provisioning:ro
         - ./observability/grafana/dashboards:/etc/grafana/slm-dashboards:ro
         - greptime_grafana_data:/var/lib/grafana
      depends_on:
         greptimedb:
            condition: service_healthy
      restart: unless-stopped

volumes:
   greptime_data:
   greptime_grafana_data:
