services:
   app:
      # if you wish to freeze your SLM install, you can do so by referencing the package created by a specific commit in https://github.com/Tactrigsds/squad-layer-manager/pkgs/container/squad-layer-manager
      # However, it's recommanded to use :latest, as SLM has regular updates and a smooth upgrade path.
      image: ghcr.io/tactrigsds/squad-layer-manager:latest
      depends_on:
         - otel-collector
      environment:
         # send OTLP traces, metrics and logs to the collector, which routes each signal to its own store
         - OTLP_COLLECTOR_ENDPOINT=http://otel-collector:4318
         # paired with mem_limit below
         - NODE_OPTIONS=--max-old-space-size=1024

      ports:
         # the app. ORIGIN has to match how this ends up being reached, whether that's this port directly or a
         # reverse proxy in front of it.
         - 3000:3000
      volumes:
         # the database, and any layer artifacts you drop in to override the ones the image ships. Mount the
         # directory rather than the db file: sqlite writes -wal and -shm alongside it.
         - ./data:/app/data
         # Every credential SLM reads (see .env.secrets.example). Mounted rather than passed through env_file
         # below, which would make it readable via `docker inspect`. See docs/installing.md#33-secrets.
         - ./.env.secrets:/app/.env.secrets:ro

      # Will automatically restart SLM in the event of a crash.
      restart: unless-stopped
      # Measured against a live install: V8 heap sits at ~220MB and RSS at ~500MB, with the peaks coming from the
      # layer engine load rather than anything held steadily. 1g of old space is several times the working set, and
      # it matters mostly as a ceiling: left alone, V8 sizes its heap from the *host's* memory, so on a large box it
      # will happily grow to 4GB before it collects hard. The container limit sits above that with room for the
      # engine's wasm memory, which is external to the heap.
      mem_limit: 2g
      command: ['pnpm', 'run', 'server:prod']
      # everything that is not a credential
      env_file: .env

   # One store per signal, each a single zero-config binary. Retention is a flag on each rather than
   # anything applied after the fact, and -memory.allowedBytes is what keeps them small: left alone they
   # size their caches from the *host's* RAM, so on a large box they grow to fill it. See
   # observability/README.md.
   victoria-metrics:
      image: victoriametrics/victoria-metrics:v1.111.0
      command:
         - -storageDataPath=/vm-data
         - -httpListenAddr=:8428
         - -retentionPeriod=90d
         - -memory.allowedBytes=192MB
         # otherwise OTLP metric names keep their dots and no PromQL in the dashboards matches
         - -opentelemetry.usePrometheusNaming
      ports:
         # Loopback only. Grafana and the collector reach these over the compose network; they are
         # published so you can query from the host and so a dev instance outside compose can too.
         - 127.0.0.1:8428:8428
      volumes:
         - vm_data:/vm-data
      restart: unless-stopped

   victoria-logs:
      image: victoriametrics/victoria-logs:v1.9.1-victorialogs
      command:
         - -storageDataPath=/vl-data
         - -httpListenAddr=:9428
         - -retentionPeriod=14d
         - -memory.allowedBytes=96MB
      ports:
         - 127.0.0.1:9428:9428
      volumes:
         - vl_data:/vl-data
      restart: unless-stopped

   victoria-traces:
      image: victoriametrics/victoria-traces:v0.5.0
      command:
         - -storageDataPath=/vt-data
         - -httpListenAddr=:10428
         - -retentionPeriod=3d
         - -memory.allowedBytes=96MB
      ports:
         - 127.0.0.1:10428:10428
      volumes:
         - vt_data:/vt-data
      restart: unless-stopped

   otel-collector:
      # Kept although all three stores accept OTLP directly, because it is what lets the app keep a single
      # OTLP_COLLECTOR_ENDPOINT: the fan-out to one store per signal happens here rather than in the app.
      image: otel/opentelemetry-collector-contrib:0.157.0
      command: ['--config=/etc/otelcol/config.yaml']
      volumes:
         - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      ports:
         # Loopback only. The app reaches the collector over the compose network; these are published so a dev
         # instance running outside compose can ship to the same stack.
         - 127.0.0.1:4317:4317
         - 127.0.0.1:4318:4318
      depends_on:
         - victoria-metrics
         - victoria-logs
         - victoria-traces
      restart: unless-stopped

   grafana:
      image: grafana/grafana:13.1.1
      environment:
         - GF_AUTH_ANONYMOUS_ENABLED=true
         - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
         - GF_SECURITY_ADMIN_PASSWORD=admin
         # Metrics and traces need no plugin: VictoriaMetrics serves the Prometheus API and VictoriaTraces
         # the Jaeger one, so those are Grafana's own datasources. Logs are the exception.
         - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
      ports:
         # the grafana portal
         - 3001:3000
      volumes:
         - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
         - ./observability/grafana/dashboards:/etc/grafana/slm-dashboards:ro
         - grafana_data:/var/lib/grafana
      depends_on:
         - victoria-metrics
         - victoria-logs
         - victoria-traces
      restart: unless-stopped

volumes:
   vm_data:
   vl_data:
   vt_data:
   grafana_data:
