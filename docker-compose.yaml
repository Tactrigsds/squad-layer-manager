services:
   app:
      # if you wish to freeze your SLM install, you can do so by referencing the package created by a specific commit in https://github.com/Tactrigsds/squad-layer-manager/pkgs/container/squad-layer-manager
      # However, it's recommanded to use :latest, as SLM has regular updates and a smooth upgrade path.
      image: ghcr.io/tactrigsds/squad-layer-manager:latest
      depends_on:
         - otel-collector
      environment:
         # send OTLP traces, metrics and logs to the collector, which routes each signal into GreptimeDB
         - OTLP_COLLECTOR_ENDPOINT=http://otel-collector:4318
         # paired with mem_limit below
         - NODE_OPTIONS=--max-old-space-size=1024

      ports:
         # the app. ORIGIN has to match how this ends up being reached, whether that's this port directly or a
         # reverse proxy in front of it.
         - 3000:3000
      volumes:
         # the database, and any layer artifacts you drop in to override the ones the image ships. Mount the
         # directory rather than the db file: sqlite writes -wal and -shm alongside it.
         - ./data:/app/data
         # Every credential SLM reads (see .env.secrets.example). Mounted rather than passed through env_file
         # below, which would make it readable via `docker inspect`. See docs/installing.md#33-secrets.
         - ./.env.secrets:/app/.env.secrets:ro

      # Will automatically restart SLM in the event of a crash.
      restart: unless-stopped
      # Measured against a live install: V8 heap sits at ~220MB and RSS at ~500MB, with the peaks coming from the
      # layer engine load rather than anything held steadily. 1g of old space is several times the working set, and
      # it matters mostly as a ceiling: left alone, V8 sizes its heap from the *host's* memory, so on a large box it
      # will happily grow to 4GB before it collects hard. The container limit sits above that with room for the
      # engine's wasm memory, which is external to the heap.
      mem_limit: 2g
      command: ['pnpm', 'run', 'server:prod']
      # everything that is not a credential
      env_file: .env

   greptimedb:
      # Metrics, logs and traces in one engine, read back over PromQL, SQL and the Jaeger API respectively.
      image: greptime/greptimedb:v1.1.4
      command:
         - standalone
         - start
         - --http-addr=0.0.0.0:4000
         - --rpc-bind-addr=0.0.0.0:4001
         - --mysql-addr=0.0.0.0:4002
      ports:
         # Loopback only. Grafana and the collector reach these over the compose network and do not need them
         # published; they are here so you can run ad-hoc SQL from the host.
         - 127.0.0.1:4000:4000
         - 127.0.0.1:4002:4002
      volumes:
         - greptime_data:/greptimedb_data
      healthcheck:
         test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
         interval: 5s
         timeout: 3s
         retries: 24
         start_period: 10s
      restart: unless-stopped

   greptime-init:
      # Metric retention. The log and trace tables get theirs from an ingest hint, but metrics share one
      # engine-created physical table that no hint reaches, so the database default is set here and the
      # physical table inherits it when the first export creates it. Idempotent; runs to completion and exits.
      image: greptime/greptimedb:v1.1.4
      entrypoint: ['/bin/sh', '-c']
      command:
         - curl -sf -X POST 'http://greptimedb:4000/v1/sql?db=public' --data-urlencode "sql=ALTER DATABASE public SET 'ttl' = '90d'"
      depends_on:
         greptimedb:
            condition: service_healthy
      restart: 'no'

   otel-collector:
      image: otel/opentelemetry-collector-contrib:0.157.0
      command: ['--config=/etc/otelcol/config.yaml']
      volumes:
         - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      ports:
         # Loopback only. The app reaches the collector over the compose network; these are published so a dev
         # instance running outside compose can ship to the same stack.
         - 127.0.0.1:4317:4317
         - 127.0.0.1:4318:4318
      depends_on:
         greptimedb:
            condition: service_healthy
         # so the database default is in place before the first export creates the metric tables
         greptime-init:
            condition: service_completed_successfully
      restart: unless-stopped

   grafana:
      image: grafana/grafana:13.1.1
      environment:
         - GF_AUTH_ANONYMOUS_ENABLED=true
         - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
         - GF_SECURITY_ADMIN_PASSWORD=admin
      ports:
         # the grafana portal
         - 3001:3000
      volumes:
         - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
         - ./observability/grafana/dashboards:/etc/grafana/slm-dashboards:ro
         - grafana_data:/var/lib/grafana
      depends_on:
         greptimedb:
            condition: service_healthy
      restart: unless-stopped

volumes:
   greptime_data:
   grafana_data:
